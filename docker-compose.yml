name: harare-dspace

networks:
  dspace:
    ipam:
      config:
        - subnet: 172.23.0.0/16

volumes:
  pgdata:
  solrdata:
  assetstore:

services:
  postgres:
    image: postgres:15-alpine
    container_name: dspace-db
    restart: unless-stopped
    networks: [dspace]
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: dspace
      POSTGRES_USER: dspace
      POSTGRES_PASSWORD: ${DSPACE_DB_PASSWORD:?Set DSPACE_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./config/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dspace -d dspace"]
      interval: 10s
      timeout: 5s
      retries: 10

  solr:
    image: dspace/dspace-solr:dspace-9.3
    container_name: dspace-solr
    restart: unless-stopped
    networks: [dspace]
    volumes:
      - solrdata:/var/solr/data
    user: root
    entrypoint:
      - /bin/bash
      - -c
      - |
        init-var-solr
        for core in authority oai search statistics qaevent suggestion; do
          precreate-core "$$core" "/opt/solr/server/solr/configsets/$$core"
          cp -r "/opt/solr/server/solr/configsets/$$core/." "$$core"
        done
        chown -R solr:solr /var/solr
        exec runuser -u solr -- solr-foreground
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8983/solr/"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 30s
    ports:
      - "127.0.0.1:8983:8983"

  dspace:
    image: dspace/dspace:dspace-9.3
    container_name: dspace-backend
    restart: unless-stopped
    networks: [dspace]
    depends_on:
      postgres:
        condition: service_healthy
      solr:
        condition: service_healthy
    environment:
      db__P__url: jdbc:postgresql://postgres:5432/dspace
      db__P__username: dspace
      db__P__password: ${DSPACE_DB_PASSWORD:?Set DSPACE_DB_PASSWORD in .env}
      solr__P__server: http://solr:8983/solr
      dspace__P__server__P__url: https://${SERVER_HOST:?Set SERVER_HOST in .env}/server
      dspace__P__server__P__ssr__P__url: http://dspace:8080/server
      dspace__P__ui__P__url: https://${SERVER_HOST:?Set SERVER_HOST in .env}
      dspace__P__name: ${DSPACE_SITE_NAME:-Bulawayo Polytechnic Repository}
      dspace__P__hostname: ${SERVER_HOST:?Set SERVER_HOST in .env}
      proxies__P__trusted__P__ipranges: 172.23.0
      mail__P__server: ${SMTP_HOST:-localhost}
      mail__P__from__address: ${DSPACE_FROM_EMAIL:-dspace@hrepoly.ac.zw}
      mail__P__admin: ${DSPACE_ADMIN_EMAIL:?Set DSPACE_ADMIN_EMAIL in .env}
      handle__P__prefix: ${HANDLE_PREFIX:-123456789}
      LOGGING_CONFIG: /dspace/config/log4j2-container.xml
    volumes:
      - assetstore:/dspace/assetstore
      - ./config/local.cfg:/dspace/config/local.cfg:ro
    entrypoint:
      - /bin/bash
      - -c
      - |
        /dspace/bin/dspace database migrate
        exec java -jar /dspace/webapps/server-boot.jar
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/server/api"]
      interval: 30s
      timeout: 15s
      retries: 20
      start_period: 180s

  dspace-ui:
    image: dspace/dspace-angular:dspace-9.3-dist
    container_name: dspace-frontend
    restart: unless-stopped
    networks: [dspace]
    depends_on:
      dspace:
        condition: service_healthy
    environment:
      DSPACE_UI_SSL: "true"
      DSPACE_UI_HOST: ${SERVER_HOST:?Set SERVER_HOST in .env}
      DSPACE_UI_PORT: "443"
      DSPACE_UI_NAMESPACE: /
      DSPACE_UI_BASEURL: https://${SERVER_HOST:?Set SERVER_HOST in .env}
      DSPACE_REST_SSL: "true"
      DSPACE_REST_HOST: ${SERVER_HOST:?Set SERVER_HOST in .env}
      DSPACE_REST_PORT: "443"
      DSPACE_REST_NAMESPACE: /server
      DSPACE_REST_SSRBASEURL: http://dspace:8080/server
    ports:
      - "127.0.0.1:4000:4000"
