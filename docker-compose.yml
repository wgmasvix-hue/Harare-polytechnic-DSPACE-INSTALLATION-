version: '3.8'

# =================================================================
#  Harare Polytechnic DSpace 7.6 — Docker Compose
#  Run: docker compose up -d
#  UI:  http://192.168.26.3/
# =================================================================

networks:
  dspace:
    driver: bridge

volumes:
  pgdata:
  solrdata:
  assetstore:
  dspace-config:

services:

  # ---- PostgreSQL Database ----
  postgres:
    image: postgres:15-alpine
    container_name: dspace-db
    restart: unless-stopped
    networks:
      - dspace
    environment:
      POSTGRES_DB: dspace
      POSTGRES_USER: dspace
      POSTGRES_PASSWORD: ${DSPACE_DB_PASSWORD:-DSpaceHrep2024!}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./config/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dspace -d dspace"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---- Apache Solr ----
  solr:
    image: dspace/dspace-solr:dspace-7_x
    container_name: dspace-solr
    restart: unless-stopped
    networks:
      - dspace
    volumes:
      - solrdata:/var/solr
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8983/solr/"]
      interval: 15s
      timeout: 10s
      retries: 10
    ports:
      - "127.0.0.1:8983:8983"    # Solr only accessible locally

  # ---- DSpace Backend (REST API) ----
  dspace:
    image: dspace/dspace:dspace-7.6
    container_name: dspace-backend
    restart: unless-stopped
    networks:
      - dspace
    depends_on:
      postgres:
        condition: service_healthy
      solr:
        condition: service_healthy
    environment:
      # Database
      db__P__url: "jdbc:postgresql://postgres:5432/dspace"
      db__P__username: dspace
      db__P__password: ${DSPACE_DB_PASSWORD:-DSpaceHrep2024!}
      # Solr
      solr__P__server: "http://solr:8983/solr"
      # Public URLs
      dspace__P__server__url: "http://${SERVER_HOST:-192.168.26.3}/server"
      dspace__P__ui__url: "http://${SERVER_HOST:-192.168.26.3}"
      dspace__P__name: "Harare Polytechnic Institutional Repository"
      dspace__P__hostname: "${SERVER_HOST:-192.168.26.3}"
      # Email
      mail__P__server: "${SMTP_HOST:-localhost}"
      mail__P__from__address: "dspace@hrepoly.ac.zw"
      mail__P__admin: "library@hrepoly.ac.zw"
      # Handle
      handle__P__prefix: "${HANDLE_PREFIX:-123456789}"
    volumes:
      - assetstore:/dspace/assetstore
      - dspace-config:/dspace/config
      - ./config/local.cfg:/dspace/config/local.cfg:ro
    ports:
      - "127.0.0.1:8080:8080"    # Tomcat only on localhost (Nginx proxies)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/server/api"]
      interval: 30s
      timeout: 15s
      retries: 15
      start_period: 120s

  # ---- DSpace Angular UI (Frontend) ----
  dspace-ui:
    image: dspace/dspace-angular:dspace-7.6
    container_name: dspace-frontend
    restart: unless-stopped
    networks:
      - dspace
    depends_on:
      dspace:
        condition: service_healthy
    environment:
      DSPACE_UI_SSL: "false"
      DSPACE_UI_HOST: "${SERVER_HOST:-192.168.26.3}"
      DSPACE_UI_PORT: "4000"
      DSPACE_UI_NAMESPACE: "/"
      DSPACE_REST_SSL: "false"
      DSPACE_REST_HOST: "${SERVER_HOST:-192.168.26.3}"
      DSPACE_REST_PORT: "80"
      DSPACE_REST_NAMESPACE: "/server"
    ports:
      - "127.0.0.1:4000:4000"

  # ---- Nginx Reverse Proxy ----
  nginx:
    image: nginx:alpine
    container_name: dspace-nginx
    restart: unless-stopped
    networks:
      - dspace
    depends_on:
      - dspace
      - dspace-ui
    volumes:
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 5
