# Harare Polytechnic DSpace — Nginx + HP Branding

upstream dspace_backend  { server dspace-backend:8080; keepalive 32; }
upstream dspace_frontend { server dspace-frontend:4000; keepalive 32; }

server {
    listen 80;
    server_name _;

    client_max_body_size 512M;
    client_body_timeout 300s;
    client_header_timeout 60s;
    send_timeout 300s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # HP Branding static files
    location /hp-brand.css {
        alias /etc/nginx/branding/hp-brand.css;
        add_header Cache-Control "public, max-age=86400";
    }
    location /hp-logo.svg {
        alias /etc/nginx/branding/hp-logo.svg;
        add_header Cache-Control "public, max-age=86400";
    }

    # DSpace REST API
    location /server {
        proxy_pass http://dspace_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # DSpace Angular UI (with HP CSS injection)
    location / {
        proxy_pass http://dspace_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Inject HP branding CSS into every HTML page
        sub_filter_types text/html;
        sub_filter '</head>' '<link rel="stylesheet" href="/hp-brand.css"></head>';
        sub_filter_once on;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/dspace_access.log;
    error_log  /var/log/nginx/dspace_error.log;
}
