# =================================================================
#  Harare Polytechnic Institutional Repository
#  DSpace 9 — Local Configuration
#  Server: hrepolyREP (144.91.125.128)
# =================================================================

#------------------------------------------------------------------
# CORE SETTINGS
#------------------------------------------------------------------
dspace.dir = /dspace
dspace.name = Harare Polytechnic Institutional Repository
dspace.hostname = 144.91.125.128
dspace.server.url = http://144.91.125.128/server
dspace.ui.url = http://144.91.125.128

# Default locale
default.locale = en

#------------------------------------------------------------------
# DATABASE
#------------------------------------------------------------------
db.driver = org.postgresql.Driver
db.url = jdbc:postgresql://postgres:5432/dspace
db.username = dspace
db.password = DSpaceHarare2024
db.schema = public
db.maxconnections = 30
db.maxwait = 5000
db.maxidle = 10

#------------------------------------------------------------------
# SEARCH (Solr)
#------------------------------------------------------------------
solr.server = http://solr:8983/solr

#------------------------------------------------------------------
# EMAIL — Update with your IT mail server
#------------------------------------------------------------------
mail.server = localhost
mail.server.port = 25
mail.from.address = dspace@hrepoly.ac.zw
mail.feedback.recipient = library@hrepoly.ac.zw
mail.admin = library@hrepoly.ac.zw
alert.recipient = library@hrepoly.ac.zw
mail.registration.notify = library@hrepoly.ac.zw

#------------------------------------------------------------------
# HANDLE (Digital Object Identifiers)
# Get a real prefix from https://www.handle.net/
#------------------------------------------------------------------
handle.canonical.prefix = http://hdl.handle.net/
handle.prefix = 123456789

#------------------------------------------------------------------
# FILE STORAGE
#------------------------------------------------------------------
assetstore.dir = ${dspace.dir}/assetstore

# Max upload size per file (bytes) — 500MB
upload.max = 524288000

#------------------------------------------------------------------
# USER REGISTRATION
#------------------------------------------------------------------
# Allow public self-registration
user.registration = true

# Restrict email domains (students/staff only)
# Comment out to allow any email domain
# authentication-password.domain.valid = hrepoly.ac.zw

#------------------------------------------------------------------
# METADATA SCHEMA — Harare Polytechnic specific
#------------------------------------------------------------------
# DC fields used across the repository
# (defaults are fine for most installations)

#------------------------------------------------------------------
# STATISTICS
#------------------------------------------------------------------
usage-statistics.authorization.admin.usage = true

#------------------------------------------------------------------
# THUMBNAIL GENERATION
#------------------------------------------------------------------
thumbnail.maxwidth = 300
thumbnail.maxheight = 300

#------------------------------------------------------------------
# OAI-PMH (for Google Scholar, OpenDOAR indexing)
#------------------------------------------------------------------
oai.url = http://144.91.125.128/server/oai/request

#------------------------------------------------------------------
# CROSSWALK / METADATA EXPORT
#------------------------------------------------------------------
# Enable Dublin Core metadata export
plugin.named.org.dspace.content.crosswalk.DisseminationCrosswalk = \
    org.dspace.content.crosswalk.OREDisseminationCrosswalk = ore, \
    org.dspace.content.crosswalk.DIMDisseminationCrosswalk = dim

#------------------------------------------------------------------
# PROXY (if your server is behind a proxy for internet access)
#------------------------------------------------------------------
# http.proxy.host = proxy.hrepoly.ac.zw
# http.proxy.port = 3128
